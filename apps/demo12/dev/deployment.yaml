apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo12
  namespace: demo12
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo12
  template:
    metadata:
      labels:
        app: demo12
    spec:
      containers:
        - name: demo12
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
