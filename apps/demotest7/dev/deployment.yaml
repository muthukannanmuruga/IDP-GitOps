apiVersion: apps/v1
kind: Deployment
metadata:
  name: demotest7
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demotest7
  template:
    metadata:
      labels:
        app: demotest7
    spec:
      containers:
        - name: demotest7
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
