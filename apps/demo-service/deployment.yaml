apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-service
  template:
    metadata:
      labels:
        app: demo-service
    spec:
      containers:
        - name: demo-service
          image: 490529426410.dkr.ecr.us-east-1.amazonaws.com/demo-service:f11a0d0bb1190643813c769186b7061f8ac76d1e
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
